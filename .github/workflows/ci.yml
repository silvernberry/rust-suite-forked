name : CI

on :
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs :
    ci:
        name: Build & Test
        runs-on: ubuntu-latest

        steps :
            - uses: actions/checkout@v4

            - name: Install system dependencies
              run: |
                sudo apt-get update
                sudo apt-get install -y clang libclang-dev protobuf-compiler libssl-dev pkg-config

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable           

            - name: Build (with inst and dev features)
              run: cargo build --release --features "inst dev" 

            - name: Test
              run: cargo test --workspace

            - name: Test (inst features)
              run: cargo test --workspace --features inst

            - name: Test (dev features)
              run: cargo test --workspace --features dev
            
